<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>落魄神明</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0c11;--panel:#16141c;--panel2:#1e1b26;--line:#2f2a3a;
  --txt:#e7e0d2;--dim:#8d8698;--gold:#d9b45c;--red:#d2544c;--green:#71c077;
  --blue:#6ea7da;--purple:#a983dc;--shadow:0 10px 40px #000a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% -10%,#2a1a2c 0%,var(--bg) 55%) fixed,var(--bg);
  color:var(--txt);font:14px/1.55 system-ui,"Microsoft JhengHei","PingFang TC",sans-serif;overflow:hidden}
h1,h2,h3,.serif{font-family:"Noto Serif TC","PMingLiU",serif;font-weight:700;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;padding:6px 12px}
button:hover:not(:disabled){border-color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:linear-gradient(#5a3a1c,#3c2611);border-color:#8a6430;color:#ffe7b0}
button.danger{background:#3a1515;border-color:#6d2a2a}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;max-width:1280px;margin:0 auto;padding:12px 16px;gap:10px}
/* top bar */
#top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
#top h1{font-size:20px;color:var(--gold);letter-spacing:2px}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums}
.bar{width:110px;height:8px;background:#0008;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.spacer{flex:1}
#main{display:grid;grid-template-columns:1fr 340px;gap:10px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
#center{display:grid;grid-template-rows:auto 1fr;min-height:0}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
#tabs button{border:0;border-radius:0;background:none;padding:11px 4px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;overflow:hidden}
#tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
#tabs button .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#5a2020;color:#fff;font-size:11px;visibility:hidden}
#tabs button .badge.show{visibility:visible}
#panel{overflow-y:auto;padding:14px;min-height:0}
#side{display:grid;grid-template-rows:auto 1fr;min-height:0}
#side h3{padding:10px 14px;border-bottom:1px solid var(--line);font-size:15px}
#log{overflow-y:auto;padding:8px 12px;font-size:13px;min-height:0}
#log .d{color:var(--gold);margin-top:8px;font-weight:700}
#log p{margin:3px 0;color:#cfc8bb}
.c-red{color:var(--red)}.c-green{color:var(--green)}.c-gold{color:var(--gold)}.c-dim{color:var(--dim)}.c-blue{color:var(--blue)}.c-purple{color:var(--purple)}
.role{display:flex;gap:12px;align-items:flex-start;padding:12px;margin-bottom:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.role .ic{font-size:30px;line-height:1}
.role p{margin:4px 0 0;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.q.main{border-color:#8a2f2f;box-shadow:0 0 18px #8a2f2f55}
.q .t{font-weight:700}
.q .meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--dim)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;background:#0006;border:1px solid var(--line);font-size:12px}
.stars{color:var(--red);letter-spacing:1px}
.pl{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.pl .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pl .nm{font-weight:700;font-size:15px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:4px}
.mini{height:6px;background:#0008;border-radius:3px;overflow:hidden;margin-top:3px}
.mini i{display:block;height:100%}
.section{margin:18px 0 8px;font-size:15px;color:var(--gold)}
.grave{display:flex;gap:10px;padding:8px 10px;border-left:3px solid #553;background:#0003;margin-bottom:6px;border-radius:4px}
.grave .q2{color:var(--dim);font-style:italic}
.wiki{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.wiki ul{margin:6px 0 0;padding-left:18px;color:#cfc8bb;font-size:13px}
/* temple scene */
.scene{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:800/400;min-height:300px;background:#0b0a12}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene-title{position:absolute;left:14px;top:10px;font-size:20px;color:var(--gold);text-shadow:0 2px 8px #000;letter-spacing:3px;display:flex;align-items:center;gap:4px}
.scene-act{position:absolute;left:12px;top:46px;display:flex;gap:8px;align-items:center}
.scene-act button{box-shadow:0 0 18px #d9b45c55;white-space:nowrap}
.pill{white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:2px;background:#000a;border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:13px}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1,1);opacity:1}40%{transform:scale(.85,1.12);opacity:.85}70%{transform:scale(1.05,.9);opacity:.95}}
.beam{animation:beam 6s ease-in-out infinite}
@keyframes beam{0%,100%{opacity:.6}50%{opacity:1}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.dust{animation:dust 9s linear infinite}
@keyframes dust{from{transform:translateY(0);opacity:0}20%{opacity:.8}to{transform:translateY(160px);opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--panel2);border:1px solid #2d4a66;border-radius:14px;padding:3px 10px;font-size:12px;cursor:default}
.tombs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding:10px;background:#0004;border-radius:10px}
.tomb{width:62px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--dim);cursor:help;outline:none;text-align:center}
.tomb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
.tomb.left{opacity:.6}
.tomb:hover span,.tomb:focus span{color:var(--gold)}
.bow{transform-box:fill-box;transform-origin:50% 100%;animation:bow 3s ease-in-out infinite}
@keyframes bow{0%,100%{transform:translateY(4px) scaleY(.7)}30%,70%{transform:none}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.sweep{transform-box:fill-box;transform-origin:50% 0;animation:sweep 1.4s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(18deg)}}
.plus{font:700 16px system-ui;fill:#ffe08a;paint-order:stroke;stroke:#000;stroke-width:3px;animation:plus 1.2s ease-out forwards}
@keyframes plus{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.scene-stats{position:absolute;right:12px;top:10px;display:flex;gap:6px}
.crew{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.crew-row{display:grid;grid-template-columns:minmax(120px,1fr) 260px;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.crew-row .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.jobs button{padding:4px 0;font-size:12px;border-radius:6px;white-space:nowrap}
.jobs button.on{border-color:var(--gold);background:#2a2316;color:var(--gold)}
.jobs .away{grid-column:1/-1;text-align:center;font-size:12px;padding:4px 0}
@media (max-width:520px){.crew-row{grid-template-columns:1fr}}
.rar{display:inline-block;font:800 11px/16px system-ui;padding:0 6px;border-radius:4px;letter-spacing:.5px;vertical-align:middle;color:#111}
.rar-C{background:#8e8e9a}.rar-R{background:#5aa0e6}.rar-SR{background:#b17be8}
.rar-SSR{background:linear-gradient(90deg,#f7d774,#e8a93a,#f7d774);box-shadow:0 0 8px #f0c04088}
.pl.r-SSR{border-color:#a8822a;box-shadow:0 0 14px #f0c04033}.pl.r-SR{border-color:#5d3f80}.pl.r-R{border-color:#2d4f73}
.who-btn{cursor:pointer}.who-btn:hover b{color:var(--gold);text-decoration:underline}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.sk{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid #4a3a6a;background:#2a2238;color:#d6c4f5;cursor:help;outline:none}
.ab{font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid #2f5a3a;background:#1d2e22;color:#bfe8c7;cursor:help;outline:none}
.sixline{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-top:6px;font-size:11px;text-align:center;color:var(--dim)}
.sixline b{display:block;color:var(--txt);font-size:13px}
.sheet{display:grid;grid-template-columns:220px 1fr;gap:12px;align-items:start}
.statrow span{white-space:nowrap}
.statrow{display:grid;grid-template-columns:58px 26px 1fr 86px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #ffffff0a}
.statrow button{padding:3px 0;font-size:12px}
.reveal{text-align:center;padding:4px 0 10px}
.reveal .big{font:900 54px/1 "Noto Serif TC",serif;letter-spacing:4px}
.big.C{color:#a8a8b4}.big.R{color:#6ab0f6}.big.SR{color:#c48ef8}.big.SSR{background:linear-gradient(90deg,#fff1a8,#f0b53a,#fff1a8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #f0c040aa)}
@media (max-width:560px){.sheet{grid-template-columns:1fr}.sheet svg{max-width:220px;margin:0 auto;display:block}}
/* info popover */
.info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--dim);color:var(--dim);font-size:11px;font-style:normal;cursor:help;position:relative;vertical-align:middle;margin-left:3px;outline:none;flex:none}
.info:hover,.info:focus{color:var(--gold);border-color:var(--gold)}
#tip{position:fixed;z-index:200;max-width:280px;background:#0b0a0f;border:1px solid var(--gold);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.5;box-shadow:var(--shadow);display:none;pointer-events:none;white-space:pre-line}
/* modal */
#veil{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:100}
#veil.show{display:flex}
#modal{width:min(580px,94vw);height:min(600px,88vh);display:grid;grid-template-rows:auto 1fr auto;background:var(--panel);border:1px solid var(--gold);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
#mHead{padding:14px 16px;border-bottom:1px solid var(--line)}
#mHead h2{font-size:18px;color:var(--gold)}
#mHead .sub{color:var(--dim);font-size:13px;margin-top:3px}
#mBody{overflow-y:auto;padding:12px 16px}
#mFoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--panel2)}
.pick.sel{border-color:var(--gold);background:#2a2316}
.pick input{accent-color:var(--gold)}
.pick .risk{margin-left:auto;font-size:12px;text-align:right;white-space:nowrap}
.est{display:flex;gap:16px;padding:10px;background:#0005;border-radius:8px;margin:8px 0;flex-wrap:wrap}
.est div{display:flex;flex-direction:column}
.est b{font-size:20px}
.lines p{margin:5px 0}
input[type=range]{width:100%;accent-color:var(--gold)}
.share{padding:12px;background:#0005;border-radius:8px;margin-top:10px}
@media (max-width:860px){
  body{overflow:auto}
  #app{height:auto;min-height:100vh}
  #main{grid-template-columns:1fr}
  #center{height:70vh}
  #side{height:240px}
  #tabs button{font-size:13px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1>落魄神明</h1>
    <div class="stat">📅 第 <b id="sDay">1</b> 日</div>
    <div class="stat">✨ 神力 <b id="sFaith">0</b><i class="info" tabindex="0" data-tip="信徒每膜拜一次，你就多 1 點神力。用嚟召喚玩家、施展神蹟。任務賞金你冇分出去嗰份都會變成神力。">i</i></div>
    <div class="stat">🌾 糧食 <b id="sFood">0</b><i class="info" tabindex="0" data-tip="每人每日食 1。派人「生產」先有得補充。冇嘢食，全部人士氣大跌。">i</i></div>
    <div class="stat">👑 神格 <div class="bar"><i id="bDiv" style="background:var(--gold)"></i></div><b id="sDiv">0</b><i class="info" tabindex="0" data-tip="完成任務會恢復神格。神格去到 100，主線任務「空白神座」就會喺公會出現，打贏就通關。">i</i></div>
    <div class="stat">🩸 詭異 <div class="bar"><i id="bCor" style="background:var(--red)"></i></div><b id="sCor">0</b><i class="info" tabindex="0" data-tip="世界嘅詭異程度，每日自然上升。任務過期或失敗會升更多，完成任務會壓返低。去到 100 就全村淪陷，遊戲結束。">i</i></div>
    <div class="spacer"></div>
    <button id="btnNew" title="重新開始">↺ 新局</button>
    <button id="btnNext" class="primary">▶ 下一日</button>
  </header>
  <div id="main">
    <section id="center" class="card">
      <nav id="tabs">
        <button data-tab="temple">⛩️ 神殿<span class="badge" id="bgTemple">0</span></button>
        <button data-tab="village">🏚️ 新手村<span class="badge" id="bgVillage">0</span></button>
        <button data-tab="guild">📜 公會<span class="badge" id="bgGuild">0</span></button>
        <button data-tab="players">👥 人手<span class="badge" id="bgPlayers">0</span></button>
        <button data-tab="wiki">📖 攻略<span class="badge" id="bgWiki">0</span></button>
      </nav>
      <div id="panel"></div>
    </section>
    <aside id="side" class="card">
      <h3 class="serif">神諭日誌</h3>
      <div id="log"></div>
    </aside>
  </div>
</div>
<div id="veil"><div id="modal"><div id="mHead"></div><div id="mBody"></div><div id="mFoot"></div></div></div>
<div id="tip"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const pct = x => Math.round(x*100) + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 資料 ---------- */
const CLASSES = {
  warrior:{n:'戰士',ic:'🛡️',base:14,death:0.7, d:'皮厚。死亡率 ×0.7'},
  mage:   {n:'法師',ic:'🔮',base:17,death:1.25,d:'火力最高但脆。死亡率 ×1.25'},
  rogue:  {n:'刺客',ic:'🗡️',base:15,death:1,   d:'平衡型，冇特別'},
  priest: {n:'牧師',ic:'✨',base:10,death:0.9, d:'火力低，但同隊其他人死亡率 ×0.7'},
  archer: {n:'弓手',ic:'🏹',base:13,death:0.85,d:'企後排，死亡率 ×0.85'},
  believer:{n:'信徒',ic:'🙏',base:7,death:1.1,d:'本地村民，唔識打，但膜拜最虔誠。死亡率 ×1.1'},
};
const TRAITS = {
  reckless:{n:'莽撞',c:'c-red',   d:'見門就踢。戰力 +15%，死亡率 ×1.6；得閒會自己走去「試錯」，有機會帶返攻略，亦有機會返唔到嚟。'},
  cautious:{n:'謹慎',c:'c-blue',  d:'會讀晒任務說明先出發。戰力 −10%，死亡率 ×0.5。'},
  greedy:  {n:'貪婪',c:'c-gold',  d:'課金腦。分成低過 60% 會好唔開心（士氣大跌）。'},
  wiki:    {n:'攻略組',c:'c-purple',d:'邊打邊寫 wiki。攻略進度 ×1.5。'},
  lucky:   {n:'歐皇',c:'c-green', d:'抽卡從不失手。全隊成功率 +8%。'},
  streamer:{n:'直播主',c:'c-blue',d:'成日對住空氣講嘢，村民以為佢喺度傳教。每日神力 +3。'},
  devout:  {n:'虔誠',c:'c-gold',  d:'膜拜速度 ×1.5。佢唔知乜嘢係遊戲，佢只知道你係神。'},
};
const JOBS = {
  worship:{n:'膜拜',ic:'🙏',d:'喺神像前不斷膜拜，每拜一次神力 +1。神殿越乾淨拜得越快。'},
  produce:{n:'生產',ic:'🌾',d:'去田度耕作，每人每日糧食 +3（信徒 +4）。'},
  clean:  {n:'清潔',ic:'🧹',d:'打掃神殿，每人每日整潔 +20、詭異 −1。'},
  guard:  {n:'守衛',ic:'🛡️',d:'夜晚守住神殿。詭異會派嘢嚟夜襲，冇人守就可能有人被拖走。每個守衛令詭異每日少升 1。'},
};
const STATS = [
  {k:'str',n:'力量',d:'物理傷害。戰士、刺客嘅主屬性。'},
  {k:'agi',n:'敏捷',d:'速度同閃避。弓手、刺客嘅主屬性；會降低死亡率。'},
  {k:'con',n:'體質',d:'生命力。最能降低死亡率；戰士、牧師嘅副屬性。'},
  {k:'int',n:'智力',d:'法術威力。法師、牧師嘅主屬性；寫攻略更快。'},
  {k:'per',n:'感知',d:'察覺危險。降低任務實際危險度，加快攻略進度。'},
  {k:'luk',n:'幸運',d:'提升任務成功率。'},
];
const STAT_MAX = 30;
const MAINSTAT = {warrior:['str','con'], mage:['int','per'], rogue:['agi','str'], priest:['int','con'], archer:['agi','per'], believer:['con','per']};
const RARITY = {
  C:  {w:55, lo:3,  hi:7,  sk:1, ab:1, rev:0},
  R:  {w:30, lo:5,  hi:9,  sk:1, ab:1, rev:20},
  SR: {w:12, lo:7,  hi:12, sk:2, ab:1, rev:60},
  SSR:{w:3,  lo:10, hi:15, sk:2, ab:2, rev:120},
};
const SKILLS = {
  taunt:   {n:'挑釁',   d:'吸引火力：同隊其他人死亡率 ×0.8'},
  burst:   {n:'爆發',   d:'自身戰力 +25%'},
  heal:    {n:'治癒術', d:'全隊死亡率 ×0.75'},
  dodge:   {n:'殘影閃避',d:'自身死亡率 ×0.55'},
  scout:   {n:'偵察',   d:'任務實際危險度 −10%'},
  backstab:{n:'背刺',   d:'隊伍 2 人或以下時，自身戰力 +40%'},
  undying: {n:'不死身', d:'受到致命一擊時有 60% 機會撐住，變成重傷'},
  rally:   {n:'鼓舞',   d:'全隊戰力 +10%'},
  speed:   {n:'速攻',   d:'任務所需日數 −1（最少 1 日）'},

function makePlayer(kind){
  const used = new Set(S.players.map(p => p.name).concat(S.graves.map(g => g.name)));
  let name, tries = 0;
  if (kind === 'believer'){
    do { name = pick(BELIEVER_NAMES); tries++; } while (used.has(name) && tries < 50);
    return {id:S.uid++, name, cls:'believer', trait:'devout', kind, rar:'C', st:rollStats('believer','C'),
      skills:['pray'], abil:[pick(['farmer','tidy','iron','zeal'])],
      job:'worship', lv:1, exp:0, morale:90, status:'idle', inj:0, done:0, joined:S.day};
  }
  do { name = pick(NAME_A) + pick(NAME_B); tries++; } while (used.has(name) && tries < 50);
  const cls = pick(Object.keys(CLASSES).filter(c => c !== 'believer'));
  const trait = pick(Object.keys(TRAITS).filter(t => t !== 'devout'));
  const rar = rollRarity(), RR = RARITY[rar];
  return {id:S.uid++, name, cls, trait, kind:'player', rar, st:rollStats(cls, rar),
    skills:sample(Object.keys(SKILLS).filter(k => k !== 'pray'), RR.sk), abil:sample(Object.keys(ABILITIES), RR.ab),
    job:'worship', lv:1, exp:0, morale:70, status:'idle', inj:0, done:0, joined:S.day};
}
function sample(arr, n){ const a = arr.slice(), out = []; while (out.length < n && a.length) out.push(a.splice(Math.floor(Math.random()*a.length), 1)[0]); return out; }
function rollRarity(){ let r = Math.random()*100; for (const [k,v] of Object.entries(RARITY)){ if ((r -= v.w) < 0) return k; } return 'C'; }
function rollStats(cls, rar){
  const RR = RARITY[rar], st = {};
  STATS.forEach(x => st[x.k] = R(RR.lo, RR.hi));
  const [m, s2] = MAINSTAT[cls]; st[m] = Math.min(STAT_MAX, st[m]+3); st[s2] = Math.min(STAT_MAX, st[s2]+1);
  return st;
}
const hasSk = (p,k) => p.skills && p.skills.includes(k);
const hasAb = (p,k) => p.abil && p.abil.includes(k);
const lukOf = p => p.st.luk * (hasAb(p,'chosen') ? 2 : 1);
function power(p){ const [m, s2] = MAINSTAT[p.cls]; return Math.round(CLASSES[p.cls].base*0.5 + p.st[m] + p.st[s2]*0.5 + (p.lv-1)*4); }
function addExp(p, n, quiet){
  p.exp += Math.round(n * (hasAb(p,'learner') ? 1.5 : 1));
  while (p.exp >= expNeed(p.lv)){
    p.exp -= expNeed(p.lv); p.lv++;
    const m = MAINSTAT[p.cls][0], r = pick(STATS).k;
    p.st[m] = Math.min(STAT_MAX, p.st[m]+1); p.st[r] = Math.min(STAT_MAX, p.st[r]+1);
    if (!quiet) log(`⬆ ${p.name} 升到 Lv${p.lv}！${STATS.find(x=>x.k===m).n} +1，${STATS.find(x=>x.k===r).n} +1`, 'c-green');
  }
}
function statCost(p, k){ return 10 + p.st[k]*3; }
function reviveCost(g){ return 40 + g.snap.lv*15 + RARITY[g.snap.rar].rev; }
const rarBadge = r => `<span class="rar rar-${r}">${r}</span>`;
const snap = p => JSON.parse(JSON.stringify(p));
function expNeed(lv){ return lv*25; }
const MAXP = 6;
function summonCost(){ return 30 + S.summons*15; }
function worshipPeriod(p){ return (5 - 2*S.clean/100) * (p.trait === 'devout' ? 0.67 : 1) * (hasAb(p,'zeal') ? 0.67 : 1); }
function getP(id){ return S.players.find(p => p.id === id); }

function genQuest(board){
  const maxT = Math.min(5, 2 + Math.floor(S.day/5));
  const tier = board === 'village' ? R(1,2) : R(2, maxT);
  const m = pick(MONS.filter(x => !x.boss));
  return {
    id:S.uid++, board, mon:m.id, tier,
    title: pick(TPL[board]).replace('{m}', m.n),
    danger: tier*16 + R(0,8),
    days: R(1, Math.min(3, tier)),
    reward: tier*22 + R(0,15),
    expire: S.day + R(3,5),
    min: tier >= 4 ? 3 : tier >= 2 ? 2 : 1,
  };
}
function refillBoards(){
  const n = b => S.quests.filter(q => q.board === b).length;
  while (n('village') < 3) S.quests.push(genQuest('village'));

}

/* ---------- 估算 ---------- */
function estimate(q, party, bless){
  const intel = S.intel[q.mon] || 0;
  const maxPer = party.reduce((m,p) => Math.max(m, p.st.per), 0);
  let effDanger = q.danger * (1 - intel/100*0.5) * (1 - Math.min(0.15, maxPer*0.006));
  if (party.some(p => hasSk(p,'scout'))) effDanger *= 0.9;
  let pow = 0, luck = 0;
  const hasPriest = party.some(p => p.cls === 'priest');
  party.forEach(p => {
    let x = power(p) * (0.8 + p.morale/250);
    if (p.trait === 'reckless') x *= 1.15;
    if (p.trait === 'cautious') x *= 0.9;
    if (p.trait === 'lucky') luck += 0.08;
    if (hasSk(p,'burst')) x *= 1.25;
    if (hasSk(p,'backstab') && party.length <= 2) x *= 1.4;
    luck += lukOf(p) * 0.003;
    pow += x;
  });
  if (party.some(p => hasSk(p,'rally'))) pow *= 1.1;
  luck = Math.min(luck, 0.2);
  const ratio = pow / Math.max(1, effDanger);
  const succ = party.length ? clamp(1/(1+Math.exp(-4.5*(ratio-1))) + luck, 0.03, 0.97) : 0;
  const risk = {};
  party.forEach(p => {
    let r = 0.22 * Math.pow(effDanger/Math.max(1,pow), 1.6);
    r *= CLASSES[p.cls].death;
    if (p.trait === 'reckless') r *= 1.6;
    if (p.trait === 'cautious') r *= 0.5;
    if (hasPriest && p.cls !== 'priest') r *= 0.7;
    if (bless) r *= 0.5;
    r *= 1 - Math.min(0.45, (p.st.con*1.2 + p.st.agi*0.8)/100);
    if (hasSk(p,'dodge')) r *= 0.55;
    if (party.some(o => o !== p && hasSk(o,'taunt'))) r *= 0.8;
    if (party.some(o => hasSk(o,'heal'))) r *= 0.75;
    if (party.some(o => hasSk(o,'pray'))) r *= 0.85;
    risk[p.id] = clamp(r, 0.01, 0.6);
  });
  // 綜合死亡率（成功 ×1，失敗 ×1.8）
  const total = {};
  party.forEach(p => total[p.id] = clamp(risk[p.id]*succ + clamp(risk[p.id]*1.8,0,0.9)*(1-succ), 0, 0.95));
  return {succ, risk, total, effDanger, pow, intel};
}

    $('#mBody').innerHTML = `
      <div class="c-dim" style="font-size:13px">「${esc(MON[q.mon].d)}」　攻略進度 ${S.intel[q.mon]}%</div>
      <div class="est">

        <div><span class="c-dim">隊伍戰力</span><b>${Math.round(e.pow)}</b></div>
        <div><span class="c-dim">實際危險度</span><b>${Math.round(e.effDanger)}</b></div>
      </div>
      <div class="section" style="margin-top:6px">揀隊員（${sel.size}/5）<i class="info" tabindex="0" data-tip="右邊係每個人今次嘅綜合死亡率。死咗就會變成墓碑，要用神力先救得返。失敗時死亡率會高好多。">i</i></div>
      ${idle.length ? idle.map(p => `
        <label class="pick ${sel.has(p.id)?'sel':''}" data-id="${p.id}">
          <input type="checkbox" ${sel.has(p.id)?'checked':''}>
          <span>${rarBadge(p.rar)} ${CLASSES[p.cls].ic} <b>${esc(p.name)}</b> <span class="c-dim">Lv${p.lv}</span> <span class="${TRAITS[p.trait].c}">${TRAITS[p.trait].n}</span><br><span class="c-dim" style="font-size:12px">戰力 ${power(p)}｜士氣 ${p.morale}</span></span>
          <span class="risk">${sel.has(p.id) ? `死亡率<br><b class="${e.total[p.id]>.25?'c-red':e.total[p.id]>.1?'c-gold':'c-green'}">${pct(e.total[p.id])}</b>` : ''}</span>
        </label>`).join('') : '<p class="c-dim">冇閒置嘅玩家。佢哋全部出咗去，或者……</p>'}
      <label class="pick ${bless?'sel':''}" id="blessRow" style="margin-top:10px">
        <input type="checkbox" ${bless?'checked':''} ${S.faith<20?'disabled':''}>
        <span>✨ 施展神蹟（−20 神力）<br><span class="c-dim" style="font-size:12px">全隊死亡率減半。佢哋會以為係「隱藏 buff」。</span></span>
      </label>`;
    $('#mFoot').innerHTML = `<button id="mCancel">取消</button><button class="primary" id="mGo" ${(sel.size<q.min||sel.size>5)?'disabled':''}>出發</button>`;
    $('#mBody').querySelectorAll('.pick[data-id]').forEach(el => el.onclick = ev => {

/* ---------- 結算 ---------- */
function resolve(a){
  const q = a.q;
  const party = a.party.map(getP).filter(Boolean);
  const e = estimate(q, party, a.bless);
  const ok = Math.random() < e.succ;
  const lines = [], dead = [];
  const saved = [];
  party.forEach(p => {
    const r = ok ? e.risk[p.id] : clamp(e.risk[p.id]*1.8, 0, 0.9);
    if (Math.random() < r){
      if (hasSk(p,'undying') && Math.random() < 0.6) saved.push(p); else dead.push(p);
    }
  });
  const reward = Math.round(q.reward * (party.some(p => hasSk(p,'loot')) ? 1.25 : 1));
  // 攻略：試錯越多學得越多
  const wikiMult = (party.some(p => p.trait === 'wiki') ? 1.5 : 1) * (1 + party.reduce((m,p) => Math.max(m, p.st.int + p.st.per), 0)/80);
  let gain = (ok ? 8 : 18) + dead.length*15;
  gain = Math.round(gain * wikiMult);
  const before = S.intel[q.mon];
  S.intel[q.mon] = Math.min(100, before + gain);

  lines.push(`<p>${ok ? '<b class="c-green">任務成功</b>' : '<b class="c-red">任務失敗</b>'}　（成功率 ${pct(e.succ)}）</p>`);
  const sp = pick(party.filter(p => !dead.includes(p)).concat(party));
  lines.push(`<p class="c-dim">${esc(sp.name)}：「${pick(ok ? SAY.win : SAY.fail)}」</p>`);

  dead.forEach(p => {
    const last = pick(SAY.dieLast);
    const tip = `${p.name} 嘅遺言：「${last}」`;
    S.wiki[q.mon].push(tip);
    S.graves.push({name:p.name, cls:p.cls, lv:p.lv, day:S.day, where:q.title, last, snap:snap(p)});
    lines.push(`<p class="c-red">☠ ${esc(p.name)}（Lv${p.lv} ${CLASSES[p.cls].n}）倒下咗，冇再起身。<br><span class="c-dim">最後一句：「${esc(last)}」</span></p>`);
    log(`☠ ${p.name} 喺「${q.title}」死亡。佢唔會再上線。`, 'c-red');
  });
  S.players = S.players.filter(p => !dead.includes(p));
  const alive = party.filter(p => !dead.includes(p));
  if (dead.length){
    S.players.forEach(p => p.morale = clamp(p.morale - 6, 0, 100));
    alive.forEach(p => p.morale = clamp(p.morale - 12, 0, 100));
    if (alive.length) lines.push(`<p class="c-dim">${esc(pick(alive).name)}：「${esc(pick(SAY.mourn).replace('{d}', dead[0].name))}」</p>`);
  }
  if (gain) lines.push(`<p class="c-purple">📖 ${MON[q.mon].n} 攻略 +${S.intel[q.mon]-before}%（${ok?'實戰經驗':'失敗都係經驗'}${dead.length?'；用命換返嚟嘅情報':''}）</p>`);

  saved.forEach(p => lines.push(`<p class="c-gold">🩸 ${esc(p.name)} 中咗致命一擊，但「不死身」令佢撐住咗。</p>`));
  alive.forEach(p => { p.status = 'idle'; p.done++; });
  saved.forEach(p => { if (alive.includes(p)){ p.status = 'injured'; p.inj = 3; } });
  if (ok){
    S.cor = clamp(S.cor - q.tier*3, 0, 100);
    S.div = clamp(S.div + q.tier*2 + (q.main?50:0), 0, 100);
    alive.forEach(p => p.morale = clamp(p.morale + 5, 0, 100));
    log(`「${q.title}」完成。神格 +${q.tier*2}。`, 'c-green');
  } else {
    S.cor = clamp(S.cor + q.tier*2, 0, 100);
    alive.forEach(p => { p.inj = Math.max(p.inj||0, R(1,2)); p.status = 'injured'; });
    log(`「${q.title}」失敗，詭異 +${q.tier*2}。生還者受傷休養。`, 'c-gold');
  }
  if (q.main && ok) S.over = 'win';
  if (q.main && !ok){ S.quests.unshift({...q, id:S.uid++}); log('空白神座上嘅嘢仲坐喺度。委託書重新出現喺櫃台。', 'c-red'); }
  if (reward > q.reward && ok) lines.push(`<p class="c-gold">💰 掠奪：賞金 ${q.reward} → ${reward}</p>`);
  pendingReports.push({q, ok, lines, reward, alive:alive.map(p => p.id), dead:dead.length});
}

function showReport(rep){
  let share = 50;
  const draw = () => {
    const alive = rep.alive.map(getP).filter(Boolean);
    $('#mHead').innerHTML = `<h2>${rep.ok?'🏆':'💀'} ${esc(rep.q.title)}</h2><div class="sub">任務報告｜${MON[rep.q.mon].n}</div>`;
    let html = `<div class="lines">${rep.lines.join('')}</div>`;
    if (rep.ok && alive.length){
      const each = Math.floor(rep.reward * share/100 / alive.length);
      const mine = rep.reward - each*alive.length;
      html += `<div class="share">
        <div class="row"><b>分賞金俾玩家 <i class="info" tabindex="0" data-tip="分得越多，玩家升級越快、越開心。留低嘅就係你嘅神力。分得太少會打擊士氣；貪婪嘅玩家要 60% 以上先滿意。士氣跌到好低，玩家會直接退遊。">i</i></b><b class="c-gold">${share}%</b></div>
        <input type="range" id="shareR" min="0" max="100" step="5" value="${share}">
        <div class="row"><span>每人得 <b class="c-green">${each} EXP</b>（${alive.length} 人）</span><span>你得 <b class="c-gold">${mine} 神力</b></span></div>
        ${alive.map(p => {
          const m = moraleDelta(p, share);
          return `<div class="row"><span>${CLASSES[p.cls].ic} ${esc(p.name)} <span class="${TRAITS[p.trait].c}">${TRAITS[p.trait].n}</span></span><span class="${m>0?'c-green':m<0?'c-red':'c-dim'}">士氣 ${m>0?'+':''}${m}</span></div>`;
        }).join('')}
      </div>`;
    } else if (rep.ok){
      html += `<p class="c-dim">冇人生還去領賞。賞金 ${rep.reward} 全數歸你。</p>`;
    }
    $('#mBody').innerHTML = html;
    $('#mFoot').innerHTML = `<button class="primary" id="mOk">${rep.ok&&alive.length?'確認分配':'知道'}</button>`;
    const r = $('#shareR'); if (r) r.oninput = () => { share = +r.value; const st=$('#mBody').scrollTop; draw(); $('#mBody').scrollTop=st; };
    $('#mOk').onclick = () => {
      if (rep.ok){
        if (alive.length){
          const each = Math.floor(rep.reward * share/100 / alive.length);
          S.faith += rep.reward - each*alive.length;
          alive.forEach(p => {
            p.morale = clamp(p.morale + moraleDelta(p, share), 0, 100);
            addExp(p, each);
          });
          log(`分出 ${share}% 賞金，收回 ${rep.reward - each*alive.length} 神力。`, 'c-gold');
        } else S.faith += rep.reward;
      }
      checkLeavers();
      closeModal(); save(); render(); nextReport();
    };
  };
  openModal(); draw();
}
function moraleDelta(p, share){
  if (p.trait === 'greedy') return share >= 60 ? 8 : share >= 40 ? -8 : -20;
  return share >= 50 ? 8 : share >= 30 ? 0 : share >= 15 ? -10 : -18;
}
function checkLeavers(){
  S.players.filter(p => p.morale <= 10 && p.status === 'idle').forEach(p => {
    log(`🚪 ${p.name}：「呢隻 game 爛到喊，退坑！」——佢消失喺光入面，返咗去原本嘅世界。`, 'c-gold');
    S.graves.push({name:p.name, cls:p.cls, lv:p.lv, day:S.day, where:'退遊', last:'退坑！', left:true});
  });
  S.players = S.players.filter(p => !(p.morale <= 10 && p.status === 'idle'));
}
function nextReport(){
  if (pendingReports.length) showReport(pendingReports.shift());
  else checkEnd();
}

/* ---------- 每日 ---------- */
function nextDay(){
  if (S.over) return;
  S.day++;
  logDay();
  // 任務進度
  const finished = [];
  S.active.forEach(a => { a.left--; if (a.left <= 0) finished.push(a); });
  S.active = S.active.filter(a => a.left > 0);
  finished.forEach(resolve);
  // 傷患
  S.players.forEach(p => { if (p.status === 'injured' && (--p.inj <= 0 || hasAb(p,'regen'))){ p.status = 'idle'; p.inj = 0; } });
  // 莽撞玩家自己去試錯
  S.players.filter(p => p.status === 'idle' && p.trait === 'reckless').forEach(p => {
    if (Math.random() > 0.3) return;
    const m = pick(MONS.filter(x => !x.boss));
    log(`${p.name}：「${pick(SAY.solo)}」——佢自己走咗去${m.n}嗰邊。`, 'c-dim');
    const die = Math.random() < clamp(0.18 - p.lv*0.02, 0.04, 0.2);
    if (die){
      const last = pick(SAY.dieLast);
      S.intel[m.id] = Math.min(100, S.intel[m.id] + 15);
      S.wiki[m.id].push(`${p.name}（單人試錯）嘅遺言：「${last}」`);
      S.graves.push({name:p.name, cls:p.cls, lv:p.lv, day:S.day, where:'單人試錯：'+m.n, last, snap:snap(p)});
      S.players = S.players.filter(x => x !== p);
      S.players.forEach(x => x.morale = clamp(x.morale - 6, 0, 100));
      log(`☠ ${p.name} 冇返嚟。但佢死前喺論壇留低咗 ${m.n} 嘅情報（攻略 +15%）。`, 'c-red');
    } else {
      S.intel[m.id] = Math.min(100, S.intel[m.id] + 6);
      addExp(p, 6);
      S.wiki[m.id].push(`${p.name}：「${pick(['佢怕光','唔好望佢對眼','佢只會攻擊郁緊嘅嘢','喺佢背後行就安全','佢會扮你隊友把聲'])}」`);
      log(`${p.name} 試錯回來，${m.n} 攻略 +6%。`, 'c-purple');
    }
  });
  // 過期任務
  S.quests.filter(q => q.expire < S.day).forEach(q => {
    S.cor = clamp(S.cor + q.tier*3, 0, 100);
    log(`⌛ 冇人接「${q.title}」，村民失蹤咗。詭異 +${q.tier*3}。`, 'c-gold');
  });
  S.quests = S.quests.filter(q => q.expire >= S.day);
  // 每日變化
  const home = S.players.filter(p => p.status === 'idle');
  const onJob = j => home.filter(p => p.job === j);
  const streamers = S.players.filter(p => p.trait === 'streamer').length;
  const tithers = S.players.filter(p => hasAb(p,'tithe')).length;
  if (streamers || tithers) S.faith += streamers*3 + tithers*3;
  // 生產 / 食飯
  const grown = onJob('produce').reduce((t,p) => t + (p.kind === 'believer' ? 4 : 3) + (hasAb(p,'farmer') ? 3 : 0), 0);
  S.food += grown - S.players.filter(p => !hasAb(p,'iron')).length;
  if (grown) log(`🌾 田裡收成 +${grown} 糧食。`, 'c-green');
  if (S.food < 0){
    S.food = 0;
    S.players.forEach(p => p.morale = clamp(p.morale - 10, 0, 100));
    log('🍂 冇嘢食。所有人士氣 −10。玩家話：「呢隻 game 仲要計飢餓值？」', 'c-gold');
  }
  // 清潔
  const cleaners = onJob('clean').length;
  S.clean = clamp(S.clean - 8 + cleaners*20 + onJob('clean').filter(p => hasAb(p,'tidy')).length*15, 0, 100);
  // 守衛 / 夜襲
  const guards = onJob('guard');
  if (Math.random() < S.cor/120 && S.players.length){
    const threat = Math.round(S.cor/2 + R(0,15));
    const gp = guards.reduce((t,p) => t + power(p) * (hasAb(p,'nighteye') ? 2 : 1), 0);
    if (guards.length && gp >= threat){
      guards.forEach(p => addExp(p, 5));
      log(`🌙 半夜有嘢爬入神殿（威脅 ${threat}），被 ${guards.map(p=>p.name).join('、')} 趕走咗。`, 'c-green');
    } else {
      const lost = Math.floor(S.faith*0.2);
      S.faith -= lost;
      log(`🌙 半夜有嘢爬入神殿（威脅 ${threat}）${guards.length ? '，守衛頂唔住' : '，冇人守夜'}。神力被偷走 ${lost}。`, 'c-red');
      const victims = S.players.filter(p => p.status === 'idle');
      if (victims.length && Math.random() < (guards.length ? 0.15 : 0.3)){
        const v = pick(victims);
        S.graves.push({name:v.name, cls:v.cls, lv:v.lv, day:S.day, where:'夜襲：被拖入黑暗', last:pick(SAY.dieLast), snap:snap(v)});
        S.players = S.players.filter(x => x !== v);
        S.players.forEach(x => x.morale = clamp(x.morale - 8, 0, 100));
        log(`☠ ${v.name} 被拖咗入黑暗。第二朝淨係搵到一隻鞋。`, 'c-red');
      }
    }
  }
  const creep = Math.max(0, Math.min(4, 2 + Math.floor(S.day/12)) - guards.length - cleaners);
  S.cor = clamp(S.cor + creep, 0, 100);
  S.players.forEach(p => { if (p.status === 'idle') p.morale = clamp(p.morale + 1, 0, 100); });
  refillBoards();
  save(); render();
  if (S.over === 'win' || S.cor >= 100){ /* 報告後判斷 */ }
  nextReport();
}

function checkEnd(){
  if (S.over === 'win'){ endScreen(true); return; }
  if (S.cor >= 100){ S.over = 'lose'; save(); endScreen(false, '詭異吞噬咗整條村。你嘅名，最後一個記得嘅人都唔記得咗。'); return; }
  if (!S.players.length && !S.active.length && S.faith < summonCost()){
    S.over = 'lose'; save(); endScreen(false, '再冇玩家，亦冇足夠神力召喚新嘅。神殿嘅燭火熄咗。'); return;
  }
}
function endScreen(win, msg){
  $('#mHead').innerHTML = `<h2>${win ? '👑 神格復甦' : '🕯️ 神明隕落'}</h2><div class="sub">第 ${S.day} 日</div>`;
  const survivors = S.players.map(p => `${esc(p.name)} Lv${p.lv}`).join('、') || '冇';
  $('#mBody').innerHTML = win
    ? `<p>空白神座上嘅嘢崩散咗。你重新坐返上去。</p><p class="c-dim">生還玩家：${survivors}</p><p class="c-dim">佢哋登出嗰陣，以為自己打通咗一隻好真嘅遊戲。</p><p>犧牲者 ${S.graves.filter(g=>!g.left).length} 人。佢哋嘅名會刻喺你神殿嘅牆上。</p>`
    : `<p>${msg}</p><p class="c-dim">死亡 ${S.graves.filter(g=>!g.left).length} 人，退遊 ${S.graves.filter(g=>g.left).length} 人。</p>`;
  $('#mFoot').innerHTML = `<button class="primary" id="mAgain">再嚟一局</button>`;
  $('#mAgain').onclick = () => { closeModal(); newGame(); };
  openModal();
}

/* ---------- 召喚 ---------- */
function summon(){
  const c = summonCost();
  if (S.faith < c || S.players.length >= MAXP) return;
  S.faith -= c; S.summons++;
  const p = makePlayer('player');
  S.players.push(p);
  log(`✨ 召喚成功：【${p.rar}】${p.name}（${CLASSES[p.cls].n}・${TRAITS[p.trait].n}）登入咗。`, p.rar === 'SSR' ? 'c-gold' : p.rar === 'SR' ? 'c-purple' : 'c-blue');
  log(`${p.name}：「${p.rar === 'SSR' ? '出 SSR 啦！！呢個帳號值錢喇' : p.rar === 'C' ? '吓，C 卡？可唔可以 reroll？' : '哇，新手村建模好真！'}」`, 'c-dim');
  save(); render();
  openSheet(p.id, {summoned:true});
}

    <ellipse cx="400" cy="112" rx="15" ry="18" fill="#d9b45c" fill-opacity="${(div*0.55).toFixed(2)}" stroke="#d9b45c" stroke-width="1.2" stroke-dasharray="${div>=1?'0':'3 3'}"/>
    <path d="M393 112 h4 M403 112 h4" stroke="#fff4d0" stroke-width="1.5" stroke-linecap="round" opacity="${div.toFixed(2)}"/>
  </g>
  <!-- 跌喺地上嘅頭 -->
  <g opacity="${(1-div*0.9).toFixed(2)}" transform="rotate(-24 548 350)">
    <ellipse cx="548" cy="350" rx="16" ry="18" fill="#5e5768"/>
    <path d="M540 348 q4 3 7 0 M551 348 q4 3 7 0" stroke="#2a2531" stroke-width="1.5" fill="none"/>

</svg>`;
}

/* ---------- 畫面 ---------- */
function stars(t){ return `<span class="stars">${'★'.repeat(Math.min(t,6))}</span>`; }
function questCard(q){
  const e = S.intel[q.mon];
  const left = q.expire === Infinity ? '不會過期' : `剩 ${q.expire - S.day + 1} 日過期`;
  return `<div class="q ${q.main?'main':''}">
    <div class="t">${esc(q.title)}</div>
    <div class="meta">${stars(q.tier)}<span class="tag">${MON[q.mon].n}</span><span class="tag">${q.days} 日</span><span class="tag">最少 ${q.min} 人</span></div>
    <div class="meta"><span>💰 賞金 <b class="c-gold">${q.reward}</b></span><span>☠ 危險 ${q.danger}</span><span class="c-purple">📖 ${e}%</span></div>
    <div class="row" style="align-items:center"><span class="c-dim" style="font-size:12px">${left}</span><button class="primary" data-go="${q.id}">派人</button></div>
  </div>`;
}
function playerCard(p){
  const st = {idle:`<span class="c-green">${JOBS[p.job].ic} ${JOBS[p.job].n}</span>`, quest:'<span class="c-blue">任務中</span>', injured:`<span class="c-gold">受傷（${p.inj}日）</span>`}[p.status];
  const mc = p.morale >= 60 ? 'var(--green)' : p.morale >= 30 ? 'var(--gold)' : 'var(--red)';
  return `<div class="pl r-${p.rar}">
    <div class="hd"><span class="nm who-btn" data-sheet="${p.id}">${rarBadge(p.rar)} ${CLASSES[p.cls].ic} <b>${esc(p.name)}</b></span><span>${st}</span></div>
    <div class="row"><span>Lv${p.lv} ${CLASSES[p.cls].n}<i class="info" tabindex="0" data-tip="${CLASSES[p.cls].d}">i</i></span><span class="${TRAITS[p.trait].c}">${TRAITS[p.trait].n}<i class="info" tabindex="0" data-tip="${TRAITS[p.trait].d}">i</i></span></div>
    <div class="row"><span>戰力 <b>${power(p)}</b></span><span class="c-dim">完成 ${p.done} 次</span></div>
    <div class="sixline">${STATS.map(x => `<span>${x.n}<b>${p.st[x.k]}</b></span>`).join('')}</div>
    ${tagsHtml(p)}
    <div class="row c-dim" style="margin-top:6px"><span>EXP</span><span>${p.exp}/${expNeed(p.lv)}</span></div>
    <div class="mini"><i style="width:${p.exp/expNeed(p.lv)*100}%;background:var(--blue)"></i></div>
    <div class="row c-dim"><span>士氣</span><span>${p.morale}</span></div>
    <div class="mini"><i style="width:${p.morale}%;background:${mc}"></i></div>
    <div style="margin-top:8px">${jobButtons(p)}</div>
  </div>`;
}
function renderPanel(){
  const P = $('#panel');
  if (tab === 'temple'){
    const c = summonCost();
    P.innerHTML = `
      <div class="scene">
        ${templeSVG()}
        <div class="scene-title serif">破落神殿<i class="info" tabindex="0" data-tip="屋頂穿咗，神像冇咗頭。呢度係你真正嘅身份。蠟燭代表你嘅神力；神格越高，神像個頭就越重現；詭異越高，黑暗入面嘅眼就越多。">i</i></div>
        <div class="scene-act">
          <button class="primary" id="btnSummon" ${S.faith<c||S.players.length>=MAXP?'disabled':''}>✨ 召喚玩家（${c}）</button>
          <span class="pill">👥 ${S.players.length}/${MAXP}<i class="info" tabindex="0" data-tip="神殿最多容納 ${MAXP} 人。召喚玩家要用神力，每召喚一次下次就貴 15。">i</i></span>
        </div>
        <div class="scene-stats">
          <span class="pill">🧹 ${S.clean}%<i class="info" tabindex="0" data-tip="神殿整潔度。越乾淨，信徒膜拜得越快（每拜一次 +1 神力）。每日會變污糟 8，派人清潔先會回升。">i</i></span>
          <span class="pill">🌾 ${S.players.filter(p=>p.status==='idle'&&p.job==='produce').length} 人耕田</span>
        </div>

      ${S.active.length ? `<div class="chips">${S.active.map(a => `<span class="chip" data-tip="${esc(a.party.map(id => getP(id)?.name || '?').join('、'))}">⚔️ ${esc(a.q.title)} <b>${a.left}日</b>${a.bless?' ✨':''}</span>`).join('')}</div>` : ''}
      ${S.graves.length ? `<div class="tombs">${S.graves.map((g,i) => [g,i]).reverse().map(([g,i]) => `<div class="tomb ${g.left?'left':''}" tabindex="0" data-grave="${i}" data-tip="${esc(`${g.snap ? '【'+g.snap.rar+'】' : ''}Lv${g.lv} ${CLASSES[g.cls].n}｜第 ${g.day} 日｜${g.where}\n「${g.last}」${g.snap ? '\n撳一下睇角色／復活（'+reviveCost(g)+' 神力）' : '\n已經返咗原本嘅世界'}`)}">${g.left?'🚪':`<svg viewBox="0 0 40 44" width="34" height="38"><path d="M6 44V16a14 14 0 0 1 28 0v28z" fill="#3b3644" stroke="#55505e"/><path d="M20 12v14M14 18h12" stroke="#6d6678" stroke-width="2.5"/></svg>`}<span>${esc(g.name)}</span></div>`).join('')}</div>` : ''}`;
    const b = $('#btnSummon'); if (b) b.onclick = summon;
    wt.clear();
    P.querySelectorAll('.tomb, .chip').forEach(bindTip);
  } else if (tab === 'village' || tab === 'guild'){
    const qs = S.quests.filter(q => q.board === tab);

      ? `<div class="role"><div class="ic">🧓</div><div><h3>村長身份・新手村告示板</h3><p>你化身成村長，貼出「新手任務」。難度低、賞金少，啱新玩家練級。</p></div></div>`
      : `<div class="role"><div class="ic">🧾</div><div><h3>公會櫃台・冒險者委託</h3><p>你化身成冒險者公會嘅櫃台職員，微笑住遞上高危委託。隨住日子過去，委託會越嚟越難。</p></div></div>`)
      + `<div class="grid">${qs.map(questCard).join('') || '<p class="c-dim">暫時冇委託。</p>'}</div>`;

  } else if (tab === 'players'){
    P.innerHTML = `<div class="role"><div class="ic">👥</div><div><h3>人手名冊</h3><p>撳名睇角色卡、用神力加六維。冇出任務嘅時候，可以安排佢哋膜拜、生產、清潔或者守衛。</p></div></div>
      <div class="grid">${S.players.map(playerCard).join('') || '<p class="c-dim">一個人都冇。去神殿召喚啦。</p>'}</div>`;
  } else if (tab === 'wiki'){
    P.innerHTML = `<div class="role"><div class="ic">📖</div><div><h3>玩家論壇・攻略 Wiki</h3><p>玩家每次挑戰都會寫攻略，失敗學得仲多，死者嘅遺言最有用。攻略越高，該怪物嘅危險度越低（最多 −50%）。</p></div></div>
      <div class="grid">${MONS.filter(m => !m.boss || S.mainSpawned).map(m => `<div class="wiki">
        <div class="row"><b>${m.n}</b><span class="c-purple">${S.intel[m.id]}%</span></div>
        <div class="mini"><i style="width:${S.intel[m.id]}%;background:var(--purple)"></i></div>
        <div class="c-dim" style="font-size:12px;margin-top:4px">${esc(m.d)}</div>
        <ul>${S.wiki[m.id].slice(-4).reverse().map(t => `<li>${esc(t)}</li>`).join('') || '<li class="c-dim">未有人寫</li>'}</ul>
      </div>`).join('')}</div>`;
  }
  P.querySelectorAll('.info').forEach(bindTip);
  P.querySelectorAll('[data-sheet]').forEach(b => b.onclick = () => openSheet(+b.dataset.sheet));
  P.querySelectorAll('[data-grave]').forEach(b => b.onclick = () => { const g = S.graves[+b.dataset.grave]; if (g && g.snap) openSheet(null, {grave:g}); });
  P.querySelectorAll('.sk, .ab').forEach(bindTip);
  P.querySelectorAll('[data-job]').forEach(b => b.onclick = () => {

function jobButtons(p){
  if (p.status === 'quest') return '<div class="jobs"><span class="away c-blue">⚔️ 出緊任務</span></div>';
  if (p.status === 'injured') return `<div class="jobs"><span class="away c-gold">🩹 受傷休養（${p.inj} 日）</span></div>`;
  return '<div class="jobs">' + Object.entries(JOBS).map(([k,j]) => `<button class="${p.job===k?'on':''}" data-job="${k}" data-pid="${p.id}" title="${j.d}">${j.ic} ${j.n}</button>`).join('') + '</div>';
}
function crewRow(p){
  return `<div class="crew-row"><span class="who who-btn" data-sheet="${p.id}">${rarBadge(p.rar)} ${CLASSES[p.cls].ic} <b>${esc(p.name)}</b> <span class="c-dim">Lv${p.lv}</span></span>${jobButtons(p)}</div>`;
}
function tagsHtml(p){
  return `<div class="tags">${p.skills.map(k => `<span class="sk" tabindex="0" data-tip="技能：${SKILLS[k].d}">⚔ ${SKILLS[k].n}</span>`).join('')}${p.abil.map(k => `<span class="ab" tabindex="0" data-tip="能力：${ABILITIES[k].d}">◆ ${ABILITIES[k].n}</span>`).join('')}</div>`;
}
function radar(st, rar){
  const cx = 110, cy = 112, R0 = 82, col = {C:'#a8a8b4',R:'#6ab0f6',SR:'#c48ef8',SSR:'#f0c040'}[rar];
  const pt = (i, v) => { const a = -Math.PI/2 + i*Math.PI/3, r = R0*v/STAT_MAX; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  const ring = v => STATS.map((_,i) => pt(i, v).map(n => n.toFixed(1)).join(',')).join(' ');
  const poly = STATS.map((x,i) => pt(i, st[x.k]).map(n => n.toFixed(1)).join(',')).join(' ');
  return `<svg viewBox="0 0 220 224" width="100%" style="max-width:220px">
    ${[10,20,30].map(v => `<polygon points="${ring(v)}" fill="none" stroke="#ffffff1a"/>`).join('')}
    ${STATS.map((_,i) => { const [x,y] = pt(i, STAT_MAX); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ffffff14"/>`; }).join('')}
    <polygon points="${poly}" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="2"/>
    ${STATS.map((x,i) => { const [px,py] = pt(i, st[x.k]); return `<circle cx="${px}" cy="${py}" r="3" fill="${col}"/>`; }).join('')}
    ${STATS.map((x,i) => { const a = -Math.PI/2 + i*Math.PI/3, lx = cx + (R0+16)*Math.cos(a), ly = cy + (R0+16)*Math.sin(a) + 4; return `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="12" fill="#e7e0d2">${x.n} ${st[x.k]}</text>`; }).join('')}
  </svg>`;
}
function openSheet(id, opt = {}){
  const draw = () => {
    const p = opt.grave ? opt.grave.snap : getP(id); if (!p) return closeModal();
    const g = opt.grave;
    const RR = RARITY[p.rar];
    $('#mHead').innerHTML = `<h2>${rarBadge(p.rar)} ${CLASSES[p.cls].ic} ${esc(p.name)}</h2><div class="sub">Lv${p.lv} ${CLASSES[p.cls].n}｜<span class="${TRAITS[p.trait].c}">${TRAITS[p.trait].n}</span>｜戰力 ${power(p)}${g ? '｜🪦 已死亡' : ''}</div>`;
    const canEdit = !g;
    $('#mBody').innerHTML = (opt.summoned ? `<div class="reveal"><div class="big ${p.rar}">${p.rar}</div><div class="c-dim">${p.rar==='SSR'?'金光幾乎照穿咗神殿屋頂！':p.rar==='SR'?'紫色嘅光從神像腳下湧出。':p.rar==='R'?'一道藍光閃過。':'光好暗……不過至少係個人。'}</div></div>` : '')
      + (g ? `<p class="c-dim" style="margin-top:0">第 ${g.day} 日死於「${esc(g.where)}」。最後一句：「${esc(g.last)}」</p>` : '')
      + `<div class="sheet"><div>${radar(p.st, p.rar)}</div><div>
        <div class="section" style="margin-top:0">六維<i class="info" tabindex="0" data-tip="用神力直接提升屬性，每點上限 ${STAT_MAX}。屬性越高，加點越貴。升級時主屬性同一項隨機屬性都會 +1。">i</i></div>
        ${STATS.map(x => `<div class="statrow"><span>${x.n}<i class="info" tabindex="0" data-tip="${x.d}">i</i></span><b>${p.st[x.k]}</b>
          <div class="mini"><i style="width:${p.st[x.k]/STAT_MAX*100}%;background:var(--gold)"></i></div>
          ${canEdit ? (p.st[x.k] >= STAT_MAX ? '<button disabled>已滿</button>' : `<button data-up="${x.k}" ${S.faith < statCost(p,x.k) ? 'disabled' : ''}>+1（${statCost(p,x.k)}）</button>`) : '<span></span>'}
        </div>`).join('')}
        <div class="section">技能 ⚔ ／ 能力 ◆</div>
        ${tagsHtml(p)}
        <div class="c-dim" style="font-size:12px;margin-top:8px">稀有度 ${p.rar}：屬性 ${RR.lo}–${RR.hi}，技能 ${RR.sk} 個，能力 ${RR.ab} 個</div>
      </div></div>`;
    const cost = g ? reviveCost(g) : 0;
    $('#mFoot').innerHTML = g
      ? `<span class="c-dim" style="margin-right:auto;font-size:12px">神殿 ${S.players.length}/${MAXP}</span><button id="mClose">返回</button><button class="primary" id="mRevive" ${S.faith < cost || S.players.length >= MAXP ? 'disabled' : ''}>✨ 復活（${cost} 神力）</button>`
      : `<span class="c-gold" style="margin-right:auto">✨ 神力 ${S.faith}</span><button class="primary" id="mClose">${opt.summoned ? '歡迎加入' : '關閉'}</button>`;
    $('#mClose').onclick = () => { closeModal(); render(); };
    $('#mBody').querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
      const k = b.dataset.up, c = statCost(p, k);
      if (S.faith < c || p.st[k] >= STAT_MAX) return;
      S.faith -= c; p.st[k]++;
      log(`✨ 神力灌注：${p.name} 嘅${STATS.find(x=>x.k===k).n}升到 ${p.st[k]}。`, 'c-gold');
      save(); $('#sFaith').textContent = S.faith;
      const st = $('#mBody').scrollTop; draw(); $('#mBody').scrollTop = st;
    });
    const rv = $('#mRevive'); if (rv) rv.onclick = () => revive(g);
  };
  openModal(); draw();
}
function revive(g){
  const cost = reviveCost(g);
  if (S.faith < cost || S.players.length >= MAXP) return;
  S.faith -= cost;
  const p = snap(g.snap);
  Object.assign(p, {id:S.uid++, status:'idle', inj:0, job:'worship', morale:50, revived:(p.revived||0)+1});
  S.players.push(p);
  S.graves = S.graves.filter(x => x !== g);
  log(`✨ 你用 ${cost} 神力將 ${p.name} 由死亡拉返嚟。`, 'c-gold');
  log(`${p.name}：「${p.kind === 'believer' ? '神……多謝你。' : pick(['…我啱啱見到嘅唔係 loading 畫面。','原來呢度死咗係真係會痛。','我唔再覺得呢度係遊戲。','復活點……原來係你。'])}」`, 'c-dim');
  closeModal(); save(); render();
}
function render(){
  $('#sDay').textContent = S.day;
  $('#sFaith').textContent = S.faith;
  $('#sFood').textContent = S.food;
  $('#sDiv').textContent = S.div; $('#bDiv').style.width = S.div + '%';
  $('#sCor').textContent = S.cor; $('#bCor').style.width = S.cor + '%';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const badge = (id, n) => { const el = $(id); el.textContent = n; el.classList.toggle('show', n > 0); };
  badge('#bgTemple', S.active.length);
  badge('#bgVillage', S.quests.filter(q => q.board === 'village').length);
  badge('#bgGuild', S.quests.filter(q => q.board === 'guild').length);
  badge('#bgPlayers', 0);
  badge('#bgWiki', 0);
  $('#btnNext').disabled = !!S.over;
  renderPanel(); renderLog();
}

/* ---------- 即時膜拜 ---------- */
const wt = new Map();
let lastTs = performance.now(), saveAcc = 0;
function popPlus(id){
  if (tab !== 'temple') return;
  const fx = document.getElementById('fx'), pos = figPos[id];
  if (!fx || !pos) return;
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', pos[0]); t.setAttribute('y', pos[1]); t.setAttribute('text-anchor', 'middle');
  t.setAttribute('class', 'plus'); t.textContent = '+1';
  fx.appendChild(t); setTimeout(() => t.remove(), 1250);
}
setInterval(() => {
  const now = performance.now(), dt = Math.min(5, (now - lastTs)/1000); lastTs = now;
  if (!S || S.over) return;
  let gained = 0;
  S.players.forEach(p => {
    if (p.status !== 'idle' || p.job !== 'worship') return;
    const per = worshipPeriod(p), t = (wt.get(p.id) || 0) + dt;
    if (t >= per){ wt.set(p.id, t - per); S.faith++; gained++; popPlus(p.id); }
    else wt.set(p.id, t);
  });
  if (gained){
    $('#sFaith').textContent = S.faith;
    const b = $('#btnSummon'); if (b) b.disabled = S.faith < summonCost() || S.players.length >= MAXP;
    if (++saveAcc >= 5){ saveAcc = 0; save(); }
  }
}, 100);

/* ---------- 彈窗 / 提示 ---------- */
function openModal(){ $('#veil').classList.add('show'); }
function closeModal(){ $('#veil').classList.remove('show'); hideTip(); }
const tipEl = $('#tip');
function showTip(el){
  tipEl.textContent = el.dataset.tip; tipEl.style.display = 'block';
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = clamp(r.left + r.width/2 - w/2, 8, innerWidth - w - 8);
  let y = r.bottom + 8; if (y + h > innerHeight - 8) y = r.top - h - 8;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip(){ tipEl.style.display = 'none'; }
function bindTip(el){
  if (el._b) return; el._b = true;
  el.addEventListener('mouseenter', () => showTip(el));
  el.addEventListener('mouseleave', hideTip);
  el.addEventListener('focus', () => showTip(el));
  el.addEventListener('blur', hideTip);
  el.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); showTip(el); });
}
new MutationObserver(() => document.querySelectorAll('#mBody .info, #mBody .sk, #mBody .ab, #top .info').forEach(bindTip))
  .observe($('#modal'), {childList:true, subtree:true});

/* ---------- 存檔 ---------- */
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d && d.players){ d.quests.forEach(q => { if (q.expire === null) q.expire = Infinity; }); S = d; return true; }
  } catch(e){}
  return false;
}

/* ---------- 綁定 ---------- */
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); $('#panel').scrollTop = 0; });
$('#btnNext').onclick = nextDay;
addEventListener('pagehide', save);
$('#btnNew').onclick = () => { if (confirm('放棄呢局，重新開始？')) newGame(); };
document.querySelectorAll('#top .info').forEach(bindTip);
document.addEventListener('click', e => { if (!e.target.classList.contains('info')) hideTip(); });

if (load()){ render(); if (S.over) checkEnd(); } else newGame();
</script>
